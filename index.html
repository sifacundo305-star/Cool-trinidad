<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cool Trinidad</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --primary:#ff2f8e;
  --gradient:linear-gradient(135deg,#ff4fa3,#ff9a76,#f6c177);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Montserrat', sans-serif;
  background:#f8f8f8;
  color:#111;
}

  #adminLink{
  display:none;
  }

/* NAV */
nav{
  background:white;
  border-bottom:1px solid #eee;
}

.nav-container{
  max-width:1100px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:800;
  letter-spacing:2px;
}

.nav-links a{
  text-decoration:none;
  color:#333;
  margin-left:25px;
  font-weight:500;
  font-size:14px;
}

/* HERO */
.hero{
  background:var(--gradient);
  padding:100px 20px;
  text-align:center;
}

.hero h1{
  font-size:48px;
  font-weight:800;
  color:white;
}

.hero p{
  margin-top:20px;
  font-size:20px;
  font-weight:300;
  color:white;
}

/* PRODUCTS */
.products{
  max-width:1100px;
  margin:80px auto;
  padding:0 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.05);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content{
  padding:20px;
}

.card h3{
  font-weight:600;
}

.price{
  margin-top:8px;
  font-weight:700;
  color:var(--primary);
}

.card button{
  margin-top:15px;
  width:100%;
  padding:10px;
  border:none;
  background:var(--primary);
  color:white;
  font-weight:600;
  border-radius:10px;
  cursor:pointer;
}

/* RESPONSIVE NAV */
@media(max-width:600px){
  .nav-links{
    display:none;
  }
}

/* TOP BAR NEGRA */

.top-bar{
  background:black;
}

.top-content{
  max-width:1100px;
  margin:auto;
  padding:8px 20px;
  display:flex;
  justify-content:flex-end;
  gap:25px;
}

.top-content a{
  color:white;
  text-decoration:none;
  font-size:13px;
  font-weight:500;
}

.top-content a:hover{
  opacity:0.7;
}

h2{
  text-align:center;
  margin:70px 0 40px 0;
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  position:relative;
}

h2::after{
  content:"";
  display:block;
  width:60px;
  height:4px;
  background:var(--primary);
  margin:15px auto 0;
  border-radius:4px;
}

.whatsApp{
  display:inline-block;
  margin-top:20px;
  padding:14px 28px;
  background:#25D366;
  color:white;
  font-weight:600;
  border-radius:30px;
  text-decoration:none;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.whatsApp:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 25px rgba(0,0,0,0.2);
}  

.admin-btn{
  display:inline-block;
  margin-top:18px;
  padding:12px 28px;
  background:linear-gradient(135deg,#111,#333);
  color:white;
  border-radius:30px;
  text-decoration:none;
  font-weight:600;
  font-size:15px;
  transition:all 0.3s ease;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.admin-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<nav>
  <div class="nav-container">
    <div class="logo">COOL TRINIDAD</div>
    <button id="logoutBtn" style="background:#ff2e88; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">
  Cerrar sesión
</button>
    <div class="nav-links">
      <a href="#">Inicio</a>
      <a href="#">Productos</a>
      <a href="#">Nosotros</a>
    </div>
  </div>
  <div class="top-bar">
  <div class="top-content">
    <a href="login.html">Login</a>
    <a href="#">Registro</a>
    <a href="#">Contacto</a>
    <a href="#">        </a>
    <a href="#">       </a>
  </div>
</div>
</nav>

<section class="hero">
  <h1>Cool Trinidad</h1>
  <p>Crea tu propio estilo</p>
  <br>
  <a id="whatsappBtn"
href="#"
target="_blank"
class="whatsApp">
Pedir por WhatsApp
  </a>
<a href="admin.html" id="adminLink" class="admin-btn">modo caja</a>
</section>


<h2>productos en stock</h2>
<section class="products">
  <div class="grid" id="productos-grid">
  </div>
  
</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async function(){
let carrito = [];
  await verificarAdmin();
  // LOGOUT
  const logoutBtn = document.getElementById("logoutBtn");

  logoutBtn.addEventListener("click", async () => {

    const { error } = await supabase.auth.signOut();

    if (error) {
      console.log(error);
      alert("Error al cerrar sesión");
      return;
    }

    window.location.href = "login.html"; // mejor redirigir al login
  });
async function verificarAdmin(){

  const { data: { user } } = await supabase.auth.getUser();
  if(!user) return;

  const { data, error } = await supabase
    .from("profiles")
    .select("is_admin")
    .eq("id", user.id)
    .single();

  if(data && data.is_admin){
    document.getElementById("adminLink").style.display = "inline-block";
  }
}
  // CARGAR PRODUCTOS
  async function cargarProductos(){
    const { data, error } = await supabase
      .from("productos")
      .select("*")
      .order("id", { ascending: false });

    if(error){
      console.log(error);
      return;
    }

    const grid = document.getElementById("productos-grid");
    grid.innerHTML = "";

    data.forEach(prod => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="${prod.imagen_url}">
        <div class="card-content">
          <h3>${prod.nombre}</h3>
          <div class="price">$${prod.precio}</div>
          <button class="btnComprar">Comprar</button>          
        </div>
      `;

      grid.appendChild(card);
    });
  }

  cargarProductos();
});

card.querySelector(".btnComprar").addEventListener("click", () => {

  const producto = {
    nombre: prod.nombre,
    precio: prod.precio
  };

  carrito.push(producto);

  alert(prod.nombre + " agregado al carrito");
});
  document.getElementById("whatsappBtn").addEventListener("click", () => {

  if(carrito.length === 0){
    alert("El carrito está vacío");
    return;
  }

  let mensaje = "Hola, quiero pedir:%0A%0A";
  let total = 0;

  carrito.forEach(p => {
    mensaje += "• " + p.nombre + " - $" + p.precio + "%0A";
    total += Number(p.precio);
  });

  mensaje += "%0A*Total: $" + total + "*";

  const telefono = "59899123456";

  window.open(`https://wa.me/${telefono}?text=${mensaje}`, "_blank");

});
</script>

</body>
</html>
